# Migrations antes do rollout, uma vez por deploy. O pipeline apaga o Job
# anterior, cria este e espera `complete` antes de aplicar o Deployment: se uma
# migration falhar, a versao nova nem sobe e a antiga continua servindo.
#
# Conexao pelo DB_MIGRATION_HOST (host direto no Neon): o pooler opera em modo
# transacao e nao e indicado para DDL. run-migrations.ts faz essa escolha.
apiVersion: batch/v1
kind: Job
metadata:
  name: soat-migrate
  labels:
    app.kubernetes.io/name: soat-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: soat-tech-challenge
spec:
  # Uma nova tentativa cobre o banco do Neon acordando da suspensao; mais que
  # isso esconderia um erro real de migration.
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soat-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: soat-tech-challenge
          imagePullPolicy: IfNotPresent
          command: ['node', 'dist/infrastructure/database/typeorm/run-migrations.js']
          env:
            - name: NODE_ENV
              value: production
          envFrom:
            - secretRef:
                name: soat-db
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
