# Variaveis NAO sensiveis do app. Os segredos chegam por tres Secrets, cada um
# com um dono diferente (ver deployment.yaml):
#   soat-db         -> soat-infra-db (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS, DB_SSL, DB_MIGRATION_HOST)
#   soat-jwt        -> soat-infra-k8s/gateway (JWT_SECRET, o mesmo que o Kong confere)
#   soat-app-secret -> pipeline deste repo (WEBHOOK_SECRET, ADMIN_BOOTSTRAP_PASSWORD)
# A fonte da verdade das variaveis e o `.env.example` na raiz do repositorio.
apiVersion: v1
kind: ConfigMap
metadata:
  name: soat-app-config
  labels:
    app.kubernetes.io/name: soat-app
    app.kubernetes.io/part-of: soat-tech-challenge
data:
  NODE_ENV: 'production'
  PORT: '3000'
  JWT_EXPIRES_IN: '1h'

  # As migrations rodam no Job soat-migrate antes do rollout (k8s/migrate),
  # nunca no boot: com varias replicas subindo juntas, todas disputariam o
  # mesmo DDL.
  DB_MIGRATIONS_ON_BOOT: 'false'

  # Sem estas, o AdminSeeder nao cria administrador nenhum quando
  # NODE_ENV=production, e como POST /auth/register exige token de admin, o
  # primeiro login seria impossivel. A senha vive no Secret soat-app-secret.
  ADMIN_BOOTSTRAP_EMAIL: 'admin@oficina.com'
  ADMIN_BOOTSTRAP_NAME: 'Administrador'

  # Traces por OTLP para o otel-gateway; metricas no /metrics (9464), raspadas
  # pelo collector via anotacao do pod; logs no stdout, lidos pelo otel-agent.
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-gateway.observability.svc.cluster.local:4318'
  OTEL_METRICS_PORT: '9464'

  # Sobrescritos por ambiente nos overlays.
  OTEL_SERVICE_NAME: 'soat-app'
  OTEL_RESOURCE_ATTRIBUTES: 'deployment.environment=local'
  SWAGGER_ENABLED: 'false'
