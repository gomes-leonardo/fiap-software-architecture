# =============================================================================
# ATENCAO: OS VALORES ABAIXO SAO DE EXEMPLO E NAO SERVEM PARA AMBIENTE REAL.
#
# base64 NAO e criptografia — qualquer um com acesso a este arquivo (ou ao
# objeto Secret no cluster) le o valor em claro com `base64 -d`. Este arquivo
# esta versionado apenas porque os valores sao placeholders publicos.
#
# Antes de qualquer uso que nao seja demonstracao local:
#
#   1. Gere segredos fortes:
#        openssl rand -base64 48
#   2. Crie o Secret fora do Git, sem passar por este arquivo:
#        kubectl create secret generic soat-app-secret -n soat \
#          --from-literal=DB_USER=postgres \
#          --from-literal=DB_PASS="$(openssl rand -base64 32)" \
#          --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#          --from-literal=WEBHOOK_SECRET="$(openssl rand -base64 48)"
#   3. Em producao de verdade, use um gerenciador externo (AWS Secrets Manager
#      + External Secrets Operator, Sealed Secrets, SOPS) e remova este arquivo
#      do fluxo de apply.
#
# Valores atuais (base64 de placeholders obvios):
#   DB_USER        = postgres
#   DB_PASS        = change-me-db-password
#   JWT_SECRET     = change-me-jwt-secret
#   WEBHOOK_SECRET = change-me-webhook-secret
#
# Este mesmo Secret alimenta o app E o Postgres (db-deployment.yaml): usuario e
# senha do banco precisam ser identicos dos dois lados, e duas fontes separadas
# divergem no primeiro `kubectl edit`.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: soat-app-secret
  namespace: soat
  labels:
    app.kubernetes.io/name: soat-app
    app.kubernetes.io/part-of: soat-tech-challenge
type: Opaque
data:
  DB_USER: cG9zdGdyZXM=
  DB_PASS: Y2hhbmdlLW1lLWRiLXBhc3N3b3Jk
  JWT_SECRET: Y2hhbmdlLW1lLWp3dC1zZWNyZXQ=
  WEBHOOK_SECRET: Y2hhbmdlLW1lLXdlYmhvb2stc2VjcmV0

  # Senha do administrador inicial, lida pelo AdminSeeder no boot.
  # Placeholder — troque antes de qualquer uso nao-local.
  ADMIN_BOOTSTRAP_PASSWORD: Y2hhbmdlLW1lLWFkbWluLXBhc3N3b3Jk