name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Leitura por padrao. Os dois unicos jobs que precisam de mais (publish grava
# no GHCR) sobem o escopo localmente.
permissions:
  contents: read

# Node 24 everywhere: testcontainers 12.x (test-integration) requires
# node >= 22.22, and CI was still pinned to 20 when that dependency was
# bumped, so every integration suite failed at import time regardless of
# what the PR itself changed. 24 matches the version already validated
# locally, well clear of the >=22.22 floor.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      # ESLint and Jest only cover the files they touch; tsc checks every file
      # under the tsconfig "include" (src + test), catching type errors in code
      # that has no test yet.
      - name: TypeScript type check
        run: npx tsc --noEmit

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit -- --coverage --coverageReporters=text --coverageReporters=lcov
      - name: Check critical domain coverage
        run: |
          npx jest --selectProjects unit --coverage --coverageReporters=json-summary \
            --collectCoverageFrom='src/domain/**/*.ts'
          # No fallback on purpose: a missing summary means the coverage gate
          # did not run, which must fail the pipeline instead of passing
          # silently.
          node -e "
            const fs = require('fs');
            const summaryPath = './coverage/coverage-summary.json';
            if (!fs.existsSync(summaryPath)) {
              console.error('coverage-summary.json was not generated - failing the coverage gate.');
              process.exit(1);
            }
            const pct = require(summaryPath).total.statements.pct;
            console.log('Domain coverage: ' + pct + '%');
            if (pct < 80) { console.error('Coverage below 80%!'); process.exit(1); }
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: soat_repair_shop_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run test:integration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: soat_repair_shop_test
          DB_USER: postgres
          DB_PASS: postgres

  test-smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    # Ultimo gate de codigo antes do build: sobe o AppModule real e bate nos
    # endpoints criticos por HTTP. Roda depois das suites rapidas de proposito
    # — e o job mais caro (~2-3 min so de boot) e nao vale queimar runner se
    # um teste unitario ja quebrou.
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      # Sem `services:` e sem env de banco de proposito: o teste sobe o
      # postgres:16-alpine sozinho via Testcontainers e se autoconfigura. O
      # unico requisito e o Docker do runner, que ubuntu-latest ja tem.
      - name: Smoke tests (Testcontainers)
        run: npm run test:smoke
        timeout-minutes: 15

  # O cluster Kind roda num Mac Apple Silicon: a imagem precisa ser arm64.
  # Runner arm64 hospedado, gratuito em repositorio publico, evita emulacao.
  build:
    name: Build Docker Image
    runs-on: ubuntu-24.04-arm
    needs: [lint, typecheck, test-unit, test-integration, test-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # The layer cache lives in the GitHub Actions cache, so unchanged layers
      # (including the "npm ci" that runs inside the image) are not rebuilt on
      # every run. The image is exported as a tarball instead of pushed, so the
      # security job can reuse it instead of running docker build a second time.
      #
      # O push para o registry NAO acontece aqui: o job `publish` carrega este
      # mesmo tarball e empurra os bytes que o Trivy ja escaneou. Buildar duas
      # vezes (uma para escanear, outra para publicar) publicaria uma imagem
      # que ninguem inspecionou.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: soat-tech-challenge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=${{ runner.temp }}/soat-tech-challenge.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}/soat-tech-challenge.tar
          retention-days: 1
          if-no-files-found: error

  security:
    name: Security Scan
    runs-on: ubuntu-24.04-arm
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: NPM Audit
        run: npm audit --audit-level=high || true
      - name: Download the image built by the build job
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}
      - name: Load image into the Docker daemon
        run: docker load --input ${{ runner.temp }}/soat-tech-challenge.tar
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'soat-tech-challenge:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results.txt'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            trivy-results.txt

  publish:
    name: Publish Image
    runs-on: ubuntu-24.04-arm
    needs: [build, security]
    # Registry so recebe o que ja entrou em develop (hml) ou main (prd). PR nao
    # publica nada: um fork nao tem permissao de escrita no GHCR do repositorio.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      repository: ${{ steps.meta.outputs.repository }}
    steps:
      # GHCR, e nao ECR nem Docker Hub: o GITHUB_TOKEN que a Action ja tem
      # autentica com `packages: write`, entao nao ha credencial de nuvem nem
      # infraestrutura extra so para guardar imagem (o Terraform da #8 nao
      # provisiona ECR).
      - name: Calcular a referencia da imagem
        id: meta
        run: |
          set -euo pipefail
          # GHCR exige o caminho em minusculas; GITHUB_REPOSITORY preserva o
          # case que o dono digitou.
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA::7}"
          {
            echo "repository=${repository}"
            echo "tag=${tag}"
            echo "image=${repository}:${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Imagem: ${repository}:${tag}"

      - name: Baixar a imagem construida pelo job de build
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Carregar a imagem no daemon do Docker
        run: docker load --input ${{ runner.temp }}/soat-tech-challenge.tar

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Duas tags para o mesmo digest:
      #   sha-<short> -> imutavel, e o que o deploy referencia. Como o
      #                  Deployment usa imagePullPolicy: IfNotPresent, so uma
      #                  tag nova por commit garante que o kubelet realmente
      #                  puxe a versao nova em vez de reaproveitar o cache.
      #   latest      -> conveniencia para `docker pull` manual e demo.
      - name: Publicar no GHCR
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          REPOSITORY: ${{ steps.meta.outputs.repository }}
        run: |
          set -euo pipefail
          docker tag soat-tech-challenge:latest "${IMAGE}"
          docker tag soat-tech-challenge:latest "${REPOSITORY}:latest"
          docker push "${IMAGE}"
          docker push "${REPOSITORY}:latest"
          {
            echo "### Imagem publicada"
            echo
            echo '```'
            echo "${IMAGE}"
            echo "${REPOSITORY}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # Os overlays sao o contrato com o cluster: se um deles nao renderizar ou nao
  # passar no schema do Kubernetes, o deploy nem e tentado.
  manifests:
    name: Render dos manifestos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kustomize build + kubeconform
        run: |
          set -euo pipefail
          for overlay in hml prd hml/migrate prd/migrate; do
            echo "== overlays/${overlay}"
            kubectl kustomize "k8s/overlays/${overlay}" > rendered.yaml
            docker run --rm -v "$PWD/rendered.yaml:/rendered.yaml:ro" \
              ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /rendered.yaml
          done

  # develop -> hml, main -> prd, no runner self-hosted do Mac onde roda o Kind.
  # Sem preflight que pula: deploy sem configuracao e falha, nao sucesso.
  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'prd' || 'hml' }})
    runs-on: [self-hosted, soat-kind]
    needs: [publish, manifests]
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'prd' || 'hml' }}
    # cancel-in-progress false: matar um deploy no meio do rollout deixa o
    # cluster em estado misto.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prd' || 'hml' }}
      NAMESPACE: soat-${{ github.ref_name == 'main' && 'prd' || 'hml' }}
      GATEWAY_PORT: ${{ github.ref_name == 'main' && '18080' || '18081' }}
      IMAGE_REPOSITORY: ${{ needs.publish.outputs.repository }}
      IMAGE: ${{ needs.publish.outputs.image }}
      ROLLOUT_TIMEOUT: 300s
    steps:
      - uses: actions/checkout@v4

      - name: Conferir configuracao
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in WEBHOOK_SECRET ADMIN_BOOTSTRAP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Secret ausente::${name} nao configurado no Environment ${ENVIRONMENT} (ver .github/DEPLOYMENT.md)"
              missing=1
            fi
          done
          kubectl config use-context kind-soat
          for secret in soat-db soat-jwt; do
            if ! kubectl get secret "${secret}" -n "${NAMESPACE}" >/dev/null 2>&1; then
              echo "::error title=Infra ausente::Secret ${secret} nao existe em ${NAMESPACE}. Rode o pipeline de soat-infra-db / soat-infra-k8s antes."
              missing=1
            fi
          done
          exit "${missing}"

      # O arquivo temporario mantem os valores fora da linha de comando (ps,
      # log do runner). Apagado no fim do passo, com sucesso ou nao.
      - name: Secret soat-app-secret
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          envfile="$(mktemp)"
          trap 'rm -f "${envfile}"' EXIT
          printf 'WEBHOOK_SECRET=%s\nADMIN_BOOTSTRAP_PASSWORD=%s\n' \
            "${WEBHOOK_SECRET}" "${ADMIN_BOOTSTRAP_PASSWORD}" > "${envfile}"
          kubectl create secret generic soat-app-secret -n "${NAMESPACE}" \
            --from-env-file="${envfile}" --dry-run=client -o yaml | kubectl apply -f -

      # Um kustomization gerado por deploy fixa a imagem do commit sobre o
      # overlay do ambiente. O nome logico `soat-tech-challenge` dos manifestos
      # vira ghcr.io/<repo>:sha-<curto>.
      - name: Fixar a imagem do commit
        run: |
          set -euo pipefail
          tag="${IMAGE##*:}"
          for target in app migrate; do
            overlay="../../../overlays/${ENVIRONMENT}"
            [ "${target}" = migrate ] && overlay="${overlay}/migrate"
            dir="k8s/.deploy/${ENVIRONMENT}/${target}"
            mkdir -p "${dir}"
            printf '%s\n' \
              'apiVersion: kustomize.config.k8s.io/v1beta1' \
              'kind: Kustomization' \
              "resources: [${overlay}]" \
              'images:' \
              '  - name: soat-tech-challenge' \
              "    newName: ${IMAGE_REPOSITORY}" \
              "    newTag: ${tag}" > "${dir}/kustomization.yaml"
          done

      - name: Migrations (Job soat-migrate)
        run: |
          set -euo pipefail
          kubectl delete job soat-migrate -n "${NAMESPACE}" --ignore-not-found --wait=true
          kubectl apply -k "k8s/.deploy/${ENVIRONMENT}/migrate"
          # complete ou failed, o que vier primeiro.
          for _ in $(seq 1 60); do
            if kubectl wait --for=condition=complete job/soat-migrate -n "${NAMESPACE}" --timeout=5s >/dev/null 2>&1; then
              kubectl logs -n "${NAMESPACE}" job/soat-migrate
              exit 0
            fi
            if kubectl wait --for=condition=failed job/soat-migrate -n "${NAMESPACE}" --timeout=1s >/dev/null 2>&1; then
              kubectl logs -n "${NAMESPACE}" job/soat-migrate --all-containers || true
              echo "::error title=Migration falhou::o Deployment nao foi alterado; a versao anterior continua no ar"
              exit 1
            fi
          done
          echo "::error title=Migration sem fim::soat-migrate nao terminou em ~6 minutos"
          kubectl describe job soat-migrate -n "${NAMESPACE}" | tail -20
          exit 1

      - name: Aplicar a aplicacao
        run: kubectl apply -k "k8s/.deploy/${ENVIRONMENT}/app"

      - name: Aguardar o rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/soat-app -n "${NAMESPACE}" --timeout="${ROLLOUT_TIMEOUT}"
          deployed=$(kubectl get deployment soat-app -n "${NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="app")].image}')
          if [ "${deployed}" != "${IMAGE}" ]; then
            echo "::error title=Imagem inesperada::o cluster esta rodando '${deployed}', esperado '${IMAGE}'"
            exit 1
          fi
          echo "soat-app rodando ${deployed}"

      # Pelo mesmo caminho do usuario: Kong do ambiente na porta do host.
      - name: Smoke pelo Kong
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://127.0.0.1:${GATEWAY_PORT}/health" -o health.json; then
              cat health.json; echo
              grep -q '"status":"ok"' health.json && { echo "Smoke via Kong: OK"; exit 0; }
            fi
            sleep 2
          done
          echo "::error title=Smoke falhou::/health nao respondeu ok pelo Kong em 127.0.0.1:${GATEWAY_PORT}"
          exit 1

      - name: Resumo
        run: |
          {
            echo "## Deploy ${ENVIRONMENT}"
            echo "- Imagem: \`${IMAGE}\`"
            echo "- Namespace: \`${NAMESPACE}\`"
            echo "- Gateway: http://127.0.0.1:${GATEWAY_PORT}"
            echo "- HPA: $(kubectl get hpa soat-app -n "${NAMESPACE}" -o jsonpath='{.spec.minReplicas}-{.spec.maxReplicas}') pods"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostico da falha
        if: failure()
        run: |
          kubectl get pods -n "${NAMESPACE}" -o wide || true
          kubectl get events -n "${NAMESPACE}" --sort-by=.lastTimestamp | tail -30 || true
          kubectl describe deployment/soat-app -n "${NAMESPACE}" | tail -40 || true
          kubectl logs -n "${NAMESPACE}" -l app.kubernetes.io/name=soat-app --tail=100 --all-containers || true

      # Depois do diagnostico de proposito: os logs precisam ser os da revisao
      # quebrada, nao os da restaurada.
      - name: Rollback automatico
        if: failure()
        run: |
          set -uo pipefail
          if ! kubectl get deployment soat-app -n "${NAMESPACE}" >/dev/null 2>&1; then
            echo "::warning title=Sem rollback::o Deployment soat-app nao existe; nada a reverter."
            exit 0
          fi
          revisions=$(kubectl rollout history deployment/soat-app -n "${NAMESPACE}" | grep -c '^[0-9]' || true)
          if [ "${revisions}" -lt 2 ]; then
            echo "::warning title=Sem rollback::primeiro deploy, nao ha revisao anterior para restaurar."
            exit 0
          fi
          echo "::warning title=Rollback::revertendo soat-app para a revisao anterior."
          kubectl rollout undo deployment/soat-app -n "${NAMESPACE}"
