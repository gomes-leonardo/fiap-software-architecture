# Credenciais vem do arquivo .env (use .env.example como template).
# DB_PASS e JWT_SECRET nao tem default proposital: o compose falha rapido se
# eles nao estiverem definidos, em vez de subir com uma senha conhecida.
services:
  db:
    image: postgres:16-alpine
    container_name: soat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-soat_repair_shop}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:?defina DB_PASS no .env (cp .env.example .env)}
    # O banco fica publicado apenas em loopback por padrao. Isso preserva o
    # fluxo local do README (`docker-compose up -d db` + `npm run start:dev`)
    # sem expor o Postgres para a rede da maquina. Para um cenario
    # prodution-like em que o banco so deve ser alcancavel pela soat-network,
    # rode com DB_BIND_ADDRESS apontando para um endereco nao roteavel ou use
    # os manifestos Kubernetes — este compose e voltado a dev/demo.
    ports:
      - '${DB_BIND_ADDRESS:-127.0.0.1}:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - soat-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-soat_repair_shop}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soat-app
    restart: unless-stopped
    ports:
      - '3000:3000'
      # O /metrics expoe rotas, status codes, tamanho do pool do banco e heap —
      # mapa da aplicacao, nao segredo, mas tambem nao e para a rede. Publicar
      # so em loopback nao impede o Prometheus: ele raspa `app:9464` pela
      # soat-network, que nao depende de publicacao no host.
      # Nao conta com isto para evitar raspagem dupla: no Docker Desktop o
      # `host.docker.internal` alcanca a porta do host mesmo em loopback. Quem
      # resolve aquilo e manter um job por vez em observability/prometheus.yml.
      - '${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:9464:9464'
    environment:
      # DB_HOST/DB_PORT sao topologia interna do compose (nome do servico na
      # soat-network), nao configuracao de ambiente — por isso ficam fixos aqui
      # e nao vem do .env, que aponta para localhost no fluxo de dev local.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-soat_repair_shop}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:?defina DB_PASS no .env (cp .env.example .env)}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (cp .env.example .env)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      # Obrigatoria, como os demais segredos: sem ela o endpoint de webhook
      # recusa toda chamada, e um servico subindo calado nesse estado e pior
      # do que um compose que falha na hora.
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?defina WEBHOOK_SECRET no .env (cp .env.example .env)}
      # Com NODE_ENV=production o AdminSeeder nao cria o admin de
      # desenvolvimento, e POST /auth/register exige token — sem estas duas
      # variaveis a stack sobe sem nenhuma credencial valida e todo login
      # responde 401.
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@oficina.com}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?defina ADMIN_BOOTSTRAP_PASSWORD no .env (cp .env.example .env)}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-Administrador}
      NODE_ENV: production
      # A imagem e a de producao, mas o compose e o fluxo de desenvolvimento:
      # o Swagger fica ligado aqui e desligado no prd do Kubernetes.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      PORT: 3000
      # Sem esta variavel vale o default do codigo (`http://localhost:4318`),
      # que dentro do container aponta para o proprio app: os traces eram
      # descartados em silencio neste fluxo e so apareciam no `npm run
      # start:dev`, onde localhost e a maquina. `jaeger` e o nome do servico na
      # soat-network.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      db:
        condition: service_healthy
    networks:
      - soat-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: soat-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
      - '4318:4318'
      - '4317:4317'
    networks:
      - soat-network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: soat-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - '${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:9090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - soat-network

  grafana:
    image: grafana/grafana:11.3.1
    container_name: soat-grafana
    restart: unless-stopped
    environment:
      # Sem login para a demo: o avaliador abre a porta e ve o painel. O papel e
      # Editor e nao Admin porque Editor ja permite criar e exportar dashboard,
      # que e tudo o que esta stack precisa — Admin daria tambem
      # `datasources:create`, e quem alcancasse esta porta poderia apontar um
      # datasource novo para qualquer endereco que este container enxerga
      # (inclusive o host, via host.docker.internal) e consultar pelo proxy do
      # Grafana, sem autenticar.
      # Atencao ao mexer no OBSERVABILITY_BIND_ADDRESS: ele vale para o
      # Prometheus E para o Grafana. Abrir um para a rede abre o outro junto.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafanadata:/var/lib/grafana
    ports:
      - '${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:3002:3000'
    depends_on:
      - prometheus
    networks:
      - soat-network

volumes:
  pgdata:
  promdata:
  grafanadata:

networks:
  soat-network:
    driver: bridge
